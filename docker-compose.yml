version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slop_api
    ports:
      - "8001:8001"
    volumes:
      # V2 엔진 — 이 docker-compose 가 GitHub 레포 루트(engine/)에서 실행되는 기준
      # 다른 위치에서 엔진 사용하려면 .env 의 PKGSENTINEL_SRC 로 override
      - ${PKGSENTINEL_SRC:-./src}:/opt/pkgsentinel/src
      # 어댑터 핫리로드
      - ./adapter:/app/adapter
      # 캐시 + DB 저장 (런타임 생성, .gitignore 로 보호)
      - ./data:/data
      - ./data/.pkgsentinel:/root/.pkgsentinel
    environment:
      # ── 필수 ─────────────────────────────────────────────
      - PKGSENTINEL_DB_KEY=${PKGSENTINEL_DB_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # ── 어댑터 동작 모드 ──────────────────────────────────
      - PKGSENTINEL_LLM_MODE=${PKGSENTINEL_LLM_MODE:-auto}
      - PKGSENTINEL_HMAC_SECRET=${PKGSENTINEL_HMAC_SECRET:-}
      - PKGSENTINEL_INTEGRITY_MODE=${PKGSENTINEL_INTEGRITY_MODE:-strict}
      - PKGSENTINEL_USE_CACHE=${PKGSENTINEL_USE_CACHE:-true}
      - PKGSENTINEL_ALLOWED_ORIGINS=${PKGSENTINEL_ALLOWED_ORIGINS:-}

      # ── 실시간 sink (선택) ───────────────────────────────
      - PKGSENTINEL_WEBHOOK_URL=${PKGSENTINEL_WEBHOOK_URL:-}
      - PKGSENTINEL_WEBHOOK_SECRET=${PKGSENTINEL_WEBHOOK_SECRET:-}
      - PKGSENTINEL_STIX_OUT_DIR=${PKGSENTINEL_STIX_OUT_DIR:-}
      - PKGSENTINEL_TAXII_URL=${PKGSENTINEL_TAXII_URL:-}
      - PKGSENTINEL_TAXII_USER=${PKGSENTINEL_TAXII_USER:-}
      - PKGSENTINEL_TAXII_PASS=${PKGSENTINEL_TAXII_PASS:-}
      - PKGSENTINEL_FALCO_OUT_DIR=${PKGSENTINEL_FALCO_OUT_DIR:-}

      # ── 기타 ─────────────────────────────────────────────
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
